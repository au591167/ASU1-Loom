events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type text/html;  # Changed from application/octet-stream

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json application/wasm text/html;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Explicit MIME types for common files
        types {
            text/html                             html htm shtml;
            text/css                              css;
            text/javascript                       js;
            application/javascript                js;
            application/json                      json;
            application/wasm                      wasm;
            image/gif                             gif;
            image/jpeg                            jpeg jpg;
            image/png                             png;
            image/svg+xml                         svg svgz;
            image/x-icon                          ico;
            font/woff                             woff;
            font/woff2                            woff2;
        }

        # Main location - serve HTML files with explicit Content-Type
        location / {
            try_files $uri $uri/ /index.html;
            
            # Force correct Content-Type for HTML files
            if ($uri ~* \.html$) {
                add_header Content-Type "text/html; charset=utf-8" always;
            }
        }

        # Explicitly handle index.html
        location = /index.html {
            add_header Content-Type "text/html; charset=utf-8" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # JavaScript files
        location ~* \.js$ {
            add_header Content-Type "application/javascript; charset=utf-8" always;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # CSS files
        location ~* \.css$ {
            add_header Content-Type "text/css; charset=utf-8" always;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API proxy (if needed)
        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # GraphQL proxy
        location /graphql {
            proxy_pass http://backend:8000/graphql;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Static files caching
        location ~* \.(png|jpg|jpeg|gif|ico|svg|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
