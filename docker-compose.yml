version: '3.8'

services:
  # Traefik Reverse Proxy
  traefik:
    image: traefik:v2.11
    container_name: loom_traefik
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infrastructure/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_certs:/letsencrypt
    networks:
      - loom_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${TRAEFIK_DOMAIN:-localhost}`)"
      - "traefik.http.routers.dashboard.service=api@internal"

  # Loom Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loom_backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      SECRET_KEY: ${SECRET_KEY}
      TRAEFIK_DOMAIN: ${TRAEFIK_DOMAIN:-localhost}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-loom_network}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/app
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - loom_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Backend gets higher priority for API routes
      - "traefik.http.routers.backend.rule=Host(`${TRAEFIK_DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/graphql`) || Path(`/health`) || Path(`/info`) || PathPrefix(`/docs`))"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.priority=10"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  # Frontend (WASM) - Served via nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loom_frontend
    ports:
      - "3000:80"
    networks:
      - loom_network
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Frontend gets priority and handles all non-API routes
      - "traefik.http.routers.frontend.rule=Host(`${TRAEFIK_DOMAIN:-localhost}`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # Ensure proper Content-Type headers are preserved
      - "traefik.http.middlewares.frontend-headers.headers.customresponseheaders.Content-Type=text/html; charset=utf-8"

networks:
  loom_network:
    name: loom_network
    driver: bridge
    external: true

volumes:
  traefik_certs:
    name: loom_traefik_certs
